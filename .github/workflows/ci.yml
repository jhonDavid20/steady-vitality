name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck and build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: steady
          POSTGRES_PASSWORD: steady
          POSTGRES_DB: steady_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U steady -d steady_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://steady:steady@localhost:5432/steady_test
      RUN_DB_TESTS: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm build:shared && pnpm typecheck

      - name: Test API
        run: pnpm --filter @steady/api test

      - name: Build workspace
        run: pnpm build
